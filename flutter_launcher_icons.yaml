# Generates every launcher size from the brand artwork.
#
# The source is the same drawing the app shows in its header and on the login
# screen (`AppMark` renders `assets/images/app_mark.png`, the 384px cut of it).
#
# Re-run after changing the artwork:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  ios: true
  # iOS rejects any alpha channel in the marketing icon; the source has none,
  # the ground runs edge to edge and iOS applies its own mask.
  remove_alpha_ios: true
  background_color_ios: "#26081A"

  android: true
  # The adaptive layers are the same drawing split in two: the glowing ground
  # as the background, the letter and leaf as the foreground, inset so they
  # sit inside the middle 66% every mask shape is guaranteed to show.
  adaptive_icon_background: "assets/icon/adaptive_background.png"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21
